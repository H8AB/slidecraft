<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slidecraft · 演示文稿工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#243d34;font:16px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}main,header{max-width:1100px;margin:auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;height:75px;border-bottom:1px solid #bcc8bd}.brand{font:600 23px Georgia,serif}.badge{font-size:13px;color:#53655e}h1{font-weight:650;letter-spacing:-.04em;font-size:clamp(35px,5vw,62px);margin:26px 0 14px}h2{font-size:21px;margin:0 0 12px}p{margin:5px 0 14px}.tabs{display:flex;gap:20px;border-bottom:1px solid #b6c2b8;margin-bottom:26px}.tabs button{border:0;border-radius:0;background:none;color:#475e54;padding:10px 0;cursor:pointer}.tabs button[aria-selected=true]{color:#173e38;border-bottom:3px solid #173e38;font-weight:700}button,input,textarea{font:inherit}button{background:#174a3e;color:white;padding:9px 17px;border:0;border-radius:5px;cursor:pointer}button.secondary{background:transparent;color:#235547;border:1px solid #8b9d91}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #be6d45;outline-offset:3px}label{display:block;margin:10px 0 7px;font-weight:600}textarea{width:100%;background:#fffef9;color:#283b33;font:15px/1.65 ui-monospace,monospace;border:1px solid #a5b3a7;border-radius:4px;padding:14px;resize:vertical}input[type=file]{max-width:100%;margin:4px 0 10px}section[hidden],div[hidden]{display:none}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:38px;margin-bottom:42px}.sample{border-left:1px solid #c7cdbf;padding-left:30px}.sample img{width:100%;border-radius:3px}.small{color:#58675f;font-size:14px}.ops{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}details{margin-top:16px}summary{cursor:pointer}.msg{margin:12px 0;color:#804022}.msg:empty{display:none}ul{padding-left:21px}@media(max-width:720px){.grid{display:block}.sample{border-left:0;border-top:1px solid #c7cdbf;margin-top:25px;padding:20px 0}.badge{font-size:11px}}
</style>
<header><strong class="brand">Slidecraft</strong><span class="badge">本地 PPTX 工作台</span></header>
<main><h1>演示文稿工作台</h1><div class="tabs" role="tablist" aria-label="工作模式"><button id="newTab" role="tab" aria-selected="true">制作新稿</button><button id="editTab" role="tab" aria-selected="false">优化已有 PPT</button></div>
<p id="status" class="msg" role="status" aria-live="polite"></p><section id="newPane"><div class="grid"><div><h2>从大纲制作</h2><p class="small">首行是封面标题。用 ## 写页标题，每页可写一至三行“项目｜说明”。也可以载入案例，编辑含图表的 JSON 大纲。</p><label for="outline">演示大纲</label><textarea id="outline" rows="12">商品上新复盘
## 本周复盘重点
商品｜列出本期测试的商品与渠道。
表现｜填写实际观察到的客流与订单变化。
行动｜明确下轮调整和复核时间。</textarea>
<details><summary>添加大纲引用的图片</summary><label for="pictures">图片文件名需与 asset 的文件名一致</label><input id="pictures" type="file" multiple accept=".jpg,.jpeg,.png"></details>
<div class="ops"><button id="make">下载可编辑 PPTX</button><button class="secondary" id="loadCase">载入电商案例</button></div></div>
<aside class="sample"><h2>收纳箱主图测试</h2><img id="samplePhoto" alt="同款米白收纳箱的白底图与衣柜场景图"><p class="small">五页运营复盘，包含两版主图、可编辑图表、订单表和下轮安排。示例数据为虚构。</p></aside></div></section>
<section id="editPane" hidden><div class="grid"><div><h2>修改现有文件</h2><div class="ops"><button class="secondary" id="editCase">试用电商改版案例</button></div><label for="file">选择自己的 PPTX 原稿</label><input id="file" type="file" accept=".pptx"><p class="small">导入后可下载页码、对象编号及文字清单，交给 AI 生成排版方案。默认方案加粗可识别的短标题。</p><div class="ops"><button class="secondary" id="inventory" disabled>下载对象清单</button><button class="secondary" id="loadPlan" disabled>导入方案 JSON</button><input type="file" id="planFile" accept=".json" hidden></div><label for="plan">排版方案</label><textarea id="plan" rows="9" placeholder="选好原稿后在这里查看、修改方案。"></textarea><div class="ops"><button id="apply" disabled>应用方案并下载副本</button></div></div><aside class="sample"><h2>原稿概览</h2><p id="overview" class="small">选择文件后可查看页数和标题。</p><ul id="summary"></ul></aside></div></section>
</main><script>/*BUNDLE*/</script></html>
