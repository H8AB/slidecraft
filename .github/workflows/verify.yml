name: Verify

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci --prefix skills/slidecraft
      - run: node tools/build.cjs
      - run: python tools/package.py
      - run: node skills/slidecraft/scripts/slidecraft.cjs create examples/main-image/deck.json /tmp/slidecraft-created.pptx
      - run: node skills/slidecraft/scripts/slidecraft.cjs apply examples/main-image/02-before.pptx examples/main-image/plan.json /tmp/slidecraft-applied.pptx
      - run: unzip -t dist/slidecraft-agent.zip
      - run: unzip -t dist/slidecraft-workbuddy.zip
